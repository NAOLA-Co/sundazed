<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131b">
  <title>Set Your Password — Sundazed</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login-gate" role="dialog" aria-modal="true" aria-labelledby="acceptInviteTitle">
    <div class="login-card">
      <div class="login-card-header">
        <h1 id="acceptInviteTitle" class="login-logo">
          <img src="sundazed_logo_white.png" alt="Sundazed">
        </h1>
      </div>

      <div class="login-view">
        <p id="acceptInviteStatus">Checking your invite link…</p>

        <form id="acceptInviteForm" class="hidden" novalidate>
          <label>
            <span>New Password</span>
            <input id="acceptInvitePassword" type="password" autocomplete="new-password" placeholder="At least 6 characters">
          </label>
          <label>
            <span>Confirm Password</span>
            <input id="acceptInvitePasswordConfirm" type="password" autocomplete="new-password" placeholder="Re-enter password">
          </label>
          <button id="acceptInviteSubmit" class="primary-button" type="submit">Set Password &amp; Continue</button>
        </form>
      </div>

      <p id="acceptInviteError" class="login-error hidden"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://unpqtfqjxvbijigttdhc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_76GzVg3VQq-sgUjytYWsRg_qOBC3jPv";

    const statusEl = document.getElementById("acceptInviteStatus");
    const formEl = document.getElementById("acceptInviteForm");
    const errorEl = document.getElementById("acceptInviteError");
    const passwordInput = document.getElementById("acceptInvitePassword");
    const confirmInput = document.getElementById("acceptInvitePasswordConfirm");
    const submitButton = document.getElementById("acceptInviteSubmit");

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.remove("hidden");
    }

    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      statusEl.textContent = "Couldn't load Supabase. Check your connection and reload.";
    } else {
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: {
          detectSessionInUrl: true,
          persistSession: false,
          autoRefreshToken: false
        }
      });

      let sessionReady = false;

      client.auth.onAuthStateChange((_event, session) => {
        if (session && !sessionReady) {
          sessionReady = true;
          statusEl.textContent = "Choose a password to finish setting up your admin account.";
          formEl.classList.remove("hidden");
        }
      });

      setTimeout(() => {
        if (!sessionReady) {
          statusEl.textContent = "This invite link is invalid or has expired. Ask for a new one.";
        }
      }, 3000);

      formEl.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorEl.classList.add("hidden");

        const password = passwordInput.value;
        const confirmPassword = confirmInput.value;

        if (password.length < 6) {
          showError("Password must be at least 6 characters.");
          return;
        }
        if (password !== confirmPassword) {
          showError("Passwords don't match.");
          return;
        }

        submitButton.disabled = true;
        const { error } = await client.auth.updateUser({ password });
        submitButton.disabled = false;

        if (error) {
          showError(error.message || "Couldn't set your password. Try again.");
          return;
        }

        formEl.classList.add("hidden");
        statusEl.textContent = "Password set! Redirecting you to sign in…";
        setTimeout(() => {
          window.location.href = "./";
        }, 1500);
      });
    }
  </script>
</body>
</html>
